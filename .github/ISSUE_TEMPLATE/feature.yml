name: Feature request
description: Propose a scoped, evidence-driven improvement
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What verified gap does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Include target board, gate, validation plan, failure behavior, and rollback.
    validations:
      required: true
  - type: textarea
    id: license
    attributes:
      label: Sources and licensing
      description: List upstream URLs, revisions, model/data licenses, and redistribution constraints.
    validations:
      required: true
