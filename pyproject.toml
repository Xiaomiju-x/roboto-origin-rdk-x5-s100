[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roboto-origin-rdk"
version = "0.1.0"
description = "Evidence-driven offline validation and RDK X5/S100 migration tools for Roboto Origin"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
  {name = "Xiaomiju-x"}
]
keywords = ["RDK X5", "RDK S100", "robotics", "ROS 2", "edge AI", "BPU"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
model = ["torch>=2.1"]
onnx = ["onnx>=1.16", "onnxruntime>=1.18"]
dev = [
  "pytest>=8.0",
  "PyYAML>=6.0",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/Xiaomiju-x/roboto-origin-rdk-x5-s100"
Issues = "https://github.com/Xiaomiju-x/roboto-origin-rdk-x5-s100/issues"
Documentation = "https://github.com/Xiaomiju-x/roboto-origin-rdk-x5-s100/tree/main/docs"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
