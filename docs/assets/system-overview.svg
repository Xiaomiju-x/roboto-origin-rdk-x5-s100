<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Roboto Origin RDK X5 and S100 validation flow</title>
  <desc id="desc">A gated flow from fixed upstream sources through host golden baselines, X5 offline validation, S100 offline validation, and future physical robot stages.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#102f46"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".25"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7dd3fc"/>
    </marker>
  </defs>
  <rect width="1200" height="430" rx="24" fill="url(#bg)"/>
  <text x="56" y="62" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">Roboto Origin × RDK</text>
  <text x="56" y="94" fill="#94a3b8" font-family="Segoe UI,Arial,sans-serif" font-size="17">Evidence-driven validation, explicit claim boundaries, hardware-gated migration</text>

  <g filter="url(#shadow)" font-family="Segoe UI,Arial,sans-serif">
    <g transform="translate(56 145)">
      <rect width="200" height="150" rx="18" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
      <text x="22" y="39" fill="#bfdbfe" font-size="14" font-weight="700">SOURCE LOCK</text>
      <text x="22" y="72" fill="#fff" font-size="22" font-weight="700">Upstream</text>
      <text x="22" y="100" fill="#cbd5e1" font-size="15">URL · commit · license</text>
      <text x="22" y="124" fill="#cbd5e1" font-size="15">model · dependency · hash</text>
    </g>
    <g transform="translate(290 145)">
      <rect width="200" height="150" rx="18" fill="#153047" stroke="#38bdf8" stroke-width="2"/>
      <text x="22" y="39" fill="#bae6fd" font-size="14" font-weight="700">HOST GOLDEN</text>
      <text x="22" y="72" fill="#fff" font-size="22" font-weight="700">RTX / CPU</text>
      <text x="22" y="100" fill="#cbd5e1" font-size="15">deterministic fixtures</text>
      <text x="22" y="124" fill="#cbd5e1" font-size="15">numerical contracts</text>
    </g>
    <g transform="translate(524 145)">
      <rect width="200" height="150" rx="18" fill="#123d3a" stroke="#2dd4bf" stroke-width="2"/>
      <text x="22" y="39" fill="#99f6e4" font-size="14" font-weight="700">OFFLINE PASS</text>
      <text x="22" y="72" fill="#fff" font-size="22" font-weight="700">RDK X5</text>
      <text x="22" y="100" fill="#cbd5e1" font-size="15">official O0–O6</text>
      <text x="22" y="124" fill="#cbd5e1" font-size="15">upgrades U1–U3</text>
    </g>
    <g transform="translate(758 145)">
      <rect width="200" height="150" rx="18" fill="#3a2d16" stroke="#fbbf24" stroke-width="2"/>
      <text x="22" y="39" fill="#fde68a" font-size="14" font-weight="700">OFFLINE PASS</text>
      <text x="22" y="72" fill="#fff" font-size="22" font-weight="700">RDK S100</text>
      <text x="22" y="100" fill="#cbd5e1" font-size="15">CPU / Nash-e BPU</text>
      <text x="22" y="124" fill="#cbd5e1" font-size="15">D0–D6 · clean rebuild</text>
    </g>
    <g transform="translate(992 145)">
      <rect width="152" height="150" rx="18" fill="#3b1d2b" stroke="#fb7185" stroke-width="2" stroke-dasharray="8 6"/>
      <text x="19" y="39" fill="#fecdd3" font-size="14" font-weight="700">NOT STARTED</text>
      <text x="19" y="72" fill="#fff" font-size="22" font-weight="700">Robot</text>
      <text x="19" y="100" fill="#cbd5e1" font-size="15">HW0–HW5</text>
      <text x="19" y="124" fill="#cbd5e1" font-size="15">new approval gates</text>
    </g>
  </g>

  <g stroke="#7dd3fc" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M260 220 H282"/>
    <path d="M494 220 H516"/>
    <path d="M728 220 H750"/>
    <path d="M962 220 H984"/>
  </g>

  <g font-family="Segoe UI,Arial,sans-serif">
    <rect x="56" y="334" width="1088" height="52" rx="14" fill="#0f2234" stroke="#334155"/>
    <circle cx="82" cy="360" r="8" fill="#34d399"/>
    <text x="101" y="366" fill="#dbeafe" font-size="16">PASS means only the named gate passed. No offline result implies physical robot safety or control readiness.</text>
  </g>
</svg>
