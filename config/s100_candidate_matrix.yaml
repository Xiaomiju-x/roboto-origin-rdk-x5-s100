  bpu_measurements_min: 100
  policy_p99_ms_max: 20
  mock_guard_p99_ms_max: 5
  policy_continuous_steps_min: 10000
  nav_synthetic_goals_min: 20
  fail_close_fault_injection: true
  no_device_access: true
  no_control_output: true
  clean_exit_and_no_residual_process: true
