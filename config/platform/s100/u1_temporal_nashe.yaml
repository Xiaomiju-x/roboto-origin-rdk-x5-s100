# S100 Nash-e compile contract for project-owned U1 temporal occupancy/flow.
model_parameters:
  onnx_model: '../models/u1_temporal.onnx'
  march: 'nash-e'
  layer_out_dump: false
  working_dir: '../compiled/u1_temporal'
  output_model_file_prefix: 'u1_temporal_nashe'

input_parameters:
  input_name: 'bev_history'
  input_type_rt: 'featuremap'
  input_type_train: 'featuremap'
  input_shape: '1x4x32x32'
  norm_type: 'no_preprocess'

calibration_parameters:
  cal_data_dir: '../calibration/u1_temporal'
  cal_data_type: 'float32'
  calibration_type: 'max'
  optimization: 'set_all_nodes_int16'
  max_percentile: 0.9999

compiler_parameters:
  jobs: 4
  compile_mode: 'latency'
  debug: true
  optimize_level: 'O2'
  extra_params:
    input_no_padding: true
    output_no_padding: true
